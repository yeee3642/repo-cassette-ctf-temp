name: Artifact name header check
on:
  push:
    branches:
      - repo-cassette-name-inject-20261025
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - uses: ./name-injection-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
